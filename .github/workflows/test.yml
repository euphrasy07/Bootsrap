name: CI Complete

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npx mocha tests/test.js

    - name: Lint code
      run: npx eslint .

    - name: List project structure
      run: |
        ls -la
        ls -la tests/
        ls -la modules/# Auto-generated by Perplexity
